<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘의 퀴즈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- 상단 HUD: 로그인 후에만 보임 -->
<div id="hud" class="hud hidden">
  <div class="hud-left">
    <span class="hud-pill hud-nickname" id="hud-nickname">-</span>
    <span class="hud-pill hud-score" id="hud-score">0</span>
    <span class="hud-pill hud-streak" id="hud-streak-wrap">
      <span id="hud-streak-icon"></span>
      <span id="hud-streak-num">0일 연속</span>
    </span>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="hud-crown-btn" id="btn-open-top5" title="TOP 5">👑</button>
    <button class="hud-logout" id="btn-logout">로그아웃</button>
  </div>
</div>

<!-- 1. 로그인 화면 -->
<div id="login-view" class="view">
  <div class="card">
    <h2>🎯 오늘의 퀴즈</h2>
    <input id="student-id" type="number" placeholder="번호" min="1"/>
    <input id="student-pw" type="password" placeholder="비밀번호"/>
    <button id="btn-login">입장</button>
    <p id="login-error" class="error-text"></p>
  </div>
</div>

<!-- 2. 퀴즈 화면 (상태별로 내부 블록만 바뀜) -->
<div id="quiz-view" class="view hidden">
  <div class="card wide">

    <!-- 2-1. 공개 전 -->
    <div id="state-before-reveal" class="hidden">
      <h2>대기 중</h2>
      <p>오늘의 퀴즈가 아직 열리지 않았습니다.</p>
      <p class="countdown-text" id="countdown-reveal"></p>
    </div>

    <!-- 2-2. 공개됨, 제출 전 -->
    <div id="state-revealed-wait" class="hidden">
      <div class="quest-card">
        <div class="quest-question" id="q-text-wait"></div>
      </div>
      <p class="countdown-text" id="countdown-open">제출 시작을 기다려주세요.</p>
    </div>

    <!-- 2-3. 제출 가능 -->
    <div id="state-open" class="hidden">
      <div class="quest-card">
        <div class="quest-question" id="q-text-open"></div>
        <div id="open-input-area" style="margin-top:12px;"></div>
        <p class="retry-hint" id="retry-hint"></p>
      </div>
      <button id="btn-submit-answer">제출</button>
      <p id="submit-status" class="hint-text"></p>
    </div>

    <!-- 2-4. 마감 -->
    <div id="state-closed" class="hidden">
      <div class="quest-card">
        <div class="quest-question" id="q-text-closed"></div>
        <div id="closed-my-answer" class="hint-text"></div>
        <div id="answer-key-box" class="answer-key-box hidden">
          <div><span class="ak-label">정답</span><span id="ak-correct-answer"></span></div>
          <div id="ak-explanation-wrap" class="hidden" style="margin-top:4px;">
            <span class="ak-label">해설</span><span id="ak-explanation"></span>
          </div>
        </div>
      </div>
      <div class="result-summary" id="result-summary">
        <div id="result-correct-text"></div>
        <div class="rs-points" id="result-points"></div>
      </div>
    </div>

  </div>
</div>

<!-- TOP 5 모달 -->
<div id="top5-modal" class="modal hidden">
  <div class="modal-box">
    <h3>TOP 5</h3>
    <ul class="rank-list" id="top5-list"></ul>
    <button class="secondary" id="btn-close-top5">닫기</button>
  </div>
</div>

<script src="firebase.js"></script>
<script>
/* =========================================================
   student.js 내용 (index.html 전용 로직)
========================================================= */
const STUDENT_STATE = { OFFLINE: "OFFLINE", ONLINE: "ONLINE" };

let myId = null;
let myData = null;
let currentDate = null;
let currentMeta = null;
let currentAnswerKey = null;
let myAnswerEntry = null;
let streakBadges = null;
let selectedChoice = null;
let lastRenderedState = null;

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.getElementById(id)?.classList.remove("hidden");
}

function showQuizState(id) {
  ["state-before-reveal", "state-revealed-wait", "state-open", "state-closed"]
    .forEach(s => document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* ---------------------------------------------------------
   로그인
--------------------------------------------------------- */
document.getElementById("btn-login").addEventListener("click", async () => {
  const id = document.getElementById("student-id").value;
  const pw = document.getElementById("student-pw").value;
  const error = document.getElementById("login-error");
  error.innerText = "";

  if (!id || !pw) {
    error.innerText = "번호와 비밀번호를 입력하세요.";
    return;
  }

  const snap = await db.ref(`${PATH.STUDENTS}/${id}`).once("value");
  const data = snap.val();

  if (!data) { error.innerText = "존재하지 않는 번호입니다."; return; }
  if (data.password !== pw) { error.innerText = "비밀번호가 틀렸습니다."; return; }

  myId = id;
  myData = data;
  localStorage.setItem("myId", myId);

  await db.ref(`${PATH.STUDENTS}/${id}`).update({ status: STUDENT_STATE.ONLINE });

  startApp();
});

async function logout() {
  if (myId) {
    await db.ref(`${PATH.STUDENTS}/${myId}`).update({ status: STUDENT_STATE.OFFLINE });
  }
  localStorage.removeItem("myId");
  location.reload();
}
document.getElementById("btn-logout").addEventListener("click", logout);

/* ---------------------------------------------------------
   앱 시작: 리스너 연결
--------------------------------------------------------- */
function startApp() {
  document.getElementById("hud").classList.remove("hidden");
  showView("quiz-view");

  db.ref(`${PATH.STUDENTS}/${myId}`).on("value", (snap) => {
    myData = snap.val();
    renderHud();
  });

  db.ref(PATH.STREAK_BADGES).on("value", (snap) => {
    streakBadges = snap.val() || getDefaultStreakBadges();
    renderHud();
  });

  subscribeToDate(todayKstStr());

  // 매초 상태 재계산 (예약 시각 도달 감지 + 날짜 넘어감 감지)
  setInterval(tick, 1000);
  tick();
}

let unsubMeta = null, unsubAnswerKey = null, unsubMyAnswer = null;
function subscribeToDate(dateStr) {
  if (currentDate === dateStr) return;
  currentDate = dateStr;
  selectedChoice = null;
  lastRenderedState = null;

  if (unsubMeta) db.ref(`${PATH.QUIZZES}/${currentDate}/meta`).off("value", unsubMeta);
  if (unsubAnswerKey) db.ref(`${PATH.QUIZZES}/${currentDate}/answerKey`).off("value", unsubAnswerKey);
  if (unsubMyAnswer) db.ref(`${PATH.QUIZZES}/${currentDate}/answers/${myId}`).off("value", unsubMyAnswer);

  unsubMeta = (snap) => { currentMeta = snap.val(); render(); };
  unsubAnswerKey = (snap) => { currentAnswerKey = snap.val(); render(); };
  unsubMyAnswer = (snap) => { myAnswerEntry = snap.val(); render(); };

  db.ref(`${PATH.QUIZZES}/${dateStr}/meta`).on("value", unsubMeta);
  db.ref(`${PATH.QUIZZES}/${dateStr}/answerKey`).on("value", unsubAnswerKey);
  db.ref(`${PATH.QUIZZES}/${dateStr}/answers/${myId}`).on("value", unsubMyAnswer);
}

function tick() {
  const today = todayKstStr();
  if (today !== currentDate) subscribeToDate(today);
  render();

  if (currentMeta && currentDate) {
    const state = computeQuizState(currentMeta, serverNow());
    if (state === QUIZ_STATE.CLOSED && currentMeta.scored !== true) {
      tryFinalizeQuizScoring(currentDate).catch(() => {});
    }
  }
}

/* ---------------------------------------------------------
   렌더링
--------------------------------------------------------- */
function renderHud() {
  if (!myData) return;
  document.getElementById("hud-nickname").innerText = myData.nickname || `${myId}번`;
  document.getElementById("hud-score").innerText = myData.totalScore || 0;

  const streak = myData.currentStreak || 0;
  document.getElementById("hud-streak-num").innerText = `${streak}일 연속`;
  const badge = getStreakBadge(streak, streakBadges);
  document.getElementById("hud-streak-icon").innerText = badge ? badge.icon : "";
}

function render() {
  if (!currentMeta) {
    showQuizState("state-before-reveal");
    document.getElementById("countdown-reveal").innerText = "";
    return;
  }

  const state = computeQuizState(currentMeta, serverNow());

  if (state === QUIZ_STATE.BEFORE_REVEAL) {
    showQuizState("state-before-reveal");
    renderCountdown("countdown-reveal", currentMeta.revealAt);
  } else if (state === QUIZ_STATE.REVEALED_WAIT) {
    showQuizState("state-revealed-wait");
    document.getElementById("q-text-wait").innerText = currentMeta.questionText || "";
    renderCountdown("countdown-open", currentMeta.openAt, "제출 시작을 기다려주세요.");
  } else if (state === QUIZ_STATE.OPEN) {
    showQuizState("state-open");
    renderOpenState();
  } else if (state === QUIZ_STATE.CLOSED) {
    showQuizState("state-closed");
    renderClosedState();
  }
}

function renderCountdown(elId, targetMs, suffix) {
  const el = document.getElementById(elId);
  if (!targetMs) { el.innerText = suffix || ""; return; }
  const diff = targetMs - serverNow();
  if (diff <= 0) { el.innerText = suffix || ""; return; }
  const totalSec = Math.floor(diff / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const timeStr = h > 0 ? `${h}시간 ${m}분 ${s}초` : (m > 0 ? `${m}분 ${s}초` : `${s}초`);
  el.innerText = (suffix ? suffix + " " : "") + `(${timeStr} 후)`;
}

function renderOpenState() {
  document.getElementById("q-text-open").innerText = currentMeta.questionText || "";

  const attemptCount = myAnswerEntry?.attemptCount || 0;
  const retryLimit = currentMeta.retryLimit;
  const limitReached = retryLimit != null && attemptCount >= retryLimit;

  const inputArea = document.getElementById("open-input-area");
  const retryHint = document.getElementById("retry-hint");
  const submitBtn = document.getElementById("btn-submit-answer");

  if (retryLimit != null) {
    retryHint.innerText = limitReached
      ? ""
      : `남은 제출 횟수: ${retryLimit - attemptCount}회`;
  } else {
    retryHint.innerText = "";
  }

  // 입력 UI를 매번 새로 그리면 타이핑 중 커서가 튀므로, 최초 1회만 그림
  if (lastRenderedState !== "OPEN_" + currentMeta.type) {
    inputArea.innerHTML = "";
    if (currentMeta.type === QUESTION_TYPE.CHOICE) {
      const grid = document.createElement("div");
      grid.className = "choice-grid";
      (currentMeta.choices || []).forEach(choice => {
        const card = document.createElement("div");
        card.className = "choice-card";
        card.innerText = choice;
        card.addEventListener("click", () => {
          if (submitBtn.disabled) return;
          selectedChoice = choice;
          grid.querySelectorAll(".choice-card").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");
        });
        grid.appendChild(card);
      });
      inputArea.appendChild(grid);
    } else {
      const input = document.createElement("input");
      input.type = "text";
      input.id = "short-answer-input";
      input.placeholder = "답을 입력하세요";
      if (myAnswerEntry?.currentAnswer) input.value = myAnswerEntry.currentAnswer;
      inputArea.appendChild(input);
    }
    lastRenderedState = "OPEN_" + currentMeta.type;
  }

  if (currentMeta.type === QUESTION_TYPE.CHOICE && myAnswerEntry?.currentAnswer) {
    inputArea.querySelectorAll(".choice-card").forEach(c => {
      c.classList.toggle("selected", c.innerText === myAnswerEntry.currentAnswer);
    });
    selectedChoice = myAnswerEntry.currentAnswer;
  }

  submitBtn.disabled = limitReached;
  submitBtn.innerText = limitReached ? "더 이상 제출할 수 없습니다." : "제출";
}

document.getElementById("btn-submit-answer").addEventListener("click", async () => {
  const status = document.getElementById("submit-status");
  status.innerText = "";

  let answer = "";
  if (currentMeta.type === QUESTION_TYPE.CHOICE) {
    answer = selectedChoice || "";
  } else {
    answer = (document.getElementById("short-answer-input")?.value || "").trim();
  }

  if (!answer) { status.innerText = "답을 입력하거나 선택해주세요."; return; }

  const retryLimit = currentMeta.retryLimit;
  const attemptCount = myAnswerEntry?.attemptCount || 0;
  if (retryLimit != null && attemptCount >= retryLimit) {
    status.innerText = "더 이상 제출할 수 없습니다.";
    return;
  }

  const isCorrectNow = isAnswerCorrect(currentAnswerKey, answer);
  const answerRef = db.ref(`${PATH.QUIZZES}/${currentDate}/answers/${myId}`);

  await answerRef.update({
    currentAnswer: answer,
    attemptCount: attemptCount + 1
  });

  if (isCorrectNow) {
    const rankRef = db.ref(`${PATH.QUIZZES}/${currentDate}/meta/rankCounter`);
    const result = await rankRef.transaction(current => (current || 0) + 1);
    const newRank = result.snapshot.val();
    await answerRef.update({
      correctRank: newRank,
      correctAt: firebase.database.ServerValue.TIMESTAMP
    });
  } else {
    await answerRef.update({ correctRank: null, correctAt: null });
  }

  status.innerText = "제출 완료!";
});

function renderClosedState() {
  document.getElementById("q-text-closed").innerText = currentMeta.questionText || "";

  const myAnswer = myAnswerEntry?.currentAnswer;
  document.getElementById("closed-my-answer").innerText = myAnswer
    ? `내 답: ${myAnswer}`
    : "제출한 답이 없습니다.";

  const akBox = document.getElementById("answer-key-box");
  if (currentAnswerKey) {
    akBox.classList.remove("hidden");
    document.getElementById("ak-correct-answer").innerText = currentAnswerKey.correctAnswer || "";
    const expWrap = document.getElementById("ak-explanation-wrap");
    if (currentAnswerKey.explanation) {
      expWrap.classList.remove("hidden");
      document.getElementById("ak-explanation").innerText = currentAnswerKey.explanation;
    } else {
      expWrap.classList.add("hidden");
    }
  } else {
    akBox.classList.add("hidden");
  }

  const isCorrect = myAnswerEntry?.correctRank != null;
  document.getElementById("result-correct-text").innerText = isCorrect ? "✅ 정답!" : "❌ 오답";

  const pointsText = document.getElementById("result-points");
  if (currentMeta.scored === true) {
    const points = myAnswerEntry?.pointsAwarded || 0;
    pointsText.innerText = points > 0 ? `+${points}점 획득!` : "0점";
  } else {
    pointsText.innerText = "채점 중...";
  }
}

/* ---------------------------------------------------------
   TOP 5 모달 (전체 누적 랭킹, 로그인하면 언제든 열람 가능)
--------------------------------------------------------- */
document.getElementById("btn-open-top5").addEventListener("click", async () => {
  const list = document.getElementById("top5-list");
  list.innerHTML = "<li class='rank-row'>불러오는 중...</li>";
  document.getElementById("top5-modal").classList.remove("hidden");

  const snap = await db.ref(PATH.STUDENTS).once("value");
  const students = snap.val() || {};
  const ranked = Object.keys(students)
    .map(id => ({ id, nickname: students[id].nickname || `${id}번`, score: students[id].totalScore || 0 }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  const medals = ["🥇", "🥈", "🥉", "4", "5"];
  list.innerHTML = "";
  ranked.forEach((r, idx) => {
    const li = document.createElement("li");
    li.className = "rank-row";
    li.innerHTML = `<span class="rank-medal">${medals[idx]}</span><span class="rank-name">${escapeHtml(r.nickname)}</span><span class="rank-score">${r.score}점</span>`;
    list.appendChild(li);
  });
  if (ranked.length === 0) list.innerHTML = "<li class='rank-row'>아직 기록이 없습니다.</li>";
});
document.getElementById("btn-close-top5").addEventListener("click", () => {
  document.getElementById("top5-modal").classList.add("hidden");
});

/* ---------------------------------------------------------
   자동 로그인 (localStorage)
--------------------------------------------------------- */
window.addEventListener("load", async () => {
  const savedId = localStorage.getItem("myId");
  if (savedId) {
    const snap = await db.ref(`${PATH.STUDENTS}/${savedId}`).once("value");
    const data = snap.val();
    if (data) {
      myId = savedId;
      myData = data;
      await db.ref(`${PATH.STUDENTS}/${myId}`).update({ status: STUDENT_STATE.ONLINE });
      startApp();
    }
  }
});
</script>
</body>
</html>
